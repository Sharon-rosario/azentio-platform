name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Throwaway values for CI only; real secrets live in the deployment environment.
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      DEMO_MODE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --port 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/me && break; sleep 1; done

      - name: API security tests
        run: npm run test:security

      - name: Server log on failure
        if: failure()
        run: cat server.log

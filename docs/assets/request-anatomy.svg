<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Anatomy of a request: Chen at Kestrel Finance asks for Meridian Bank's observation 42 by id. The route wrapper, the session lookup and the permission check pass; the tenant check fails, and the answer is 404 Not found.">
  <title>Anatomy of a request</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1d25"/>
      <stop offset="1" stop-color="#16303d"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#2ed88e"/>
      <stop offset="1" stop-color="#2ed88e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Poppins, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .box { fill: #1b3a48; stroke: #2f5666; stroke-width: 1.5; }
      .flow { stroke-dasharray: 5 7; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>

  <text x="36" y="44" class="sans" font-size="13" font-weight="700" fill="#2ed88e" letter-spacing="2">ANATOMY OF A REQUEST</text>
  <text x="1164" y="44" class="sans" font-size="13" fill="#9fb6bf" text-anchor="end">Pages and the API call the same services, so no screen can skip a check</text>

  <g stroke="#2ed88e" stroke-width="2" fill="none" stroke-opacity="0.75">
    <path class="flow" d="M220 146H236"/>
    <path class="flow" d="M400 146H416"/>
    <path class="flow" d="M580 146H596"/>
    <path class="flow" d="M760 146H776"/>
    <path class="flow" d="M940 146H956" stroke="#ff8a7a"/>
  </g>
  <path id="track" d="M125 238H1063" fill="none" stroke="#2ed88e" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round"/>

  <!-- the request -->
  <rect x="30" y="76" width="190" height="140" rx="14" fill="#ffffff"/>
  <text x="48" y="104" class="sans" font-size="12" font-weight="700" fill="#556670" letter-spacing="1">REQUEST</text>
  <text x="48" y="132" class="mono" font-size="14" font-weight="700" fill="#16303d">GET /api/</text>
  <text x="48" y="152" class="mono" font-size="14" font-weight="700" fill="#16303d">observations/42</text>
  <text x="48" y="180" class="sans" font-size="13" fill="#556670">Chen, Kestrel Finance,</text>
  <text x="48" y="198" class="sans" font-size="13" fill="#556670">asks for Meridian's note</text>

  <!-- checks -->
  <g>
    <rect class="box" x="236" y="76" width="164" height="140" rx="14"/>
    <text x="252" y="106" class="mono" font-size="13" font-weight="700" fill="#2ed88e">route()</text>
    <text x="252" y="134" class="sans" font-size="13" fill="#b7c9d1">Same-origin check</text>
    <text x="252" y="153" class="sans" font-size="13" fill="#b7c9d1">on writes; a crash</text>
    <text x="252" y="172" class="sans" font-size="13" fill="#b7c9d1">stays a generic 500</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.17;0.19;0.95;1" dur="8s" repeatCount="indefinite"/>
      <circle cx="380" cy="100" r="11" fill="#2ed88e"/><path d="M375 100l3.5 3.5 6.5-7" stroke="#16303d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="252" y="200" class="sans" font-size="12" font-weight="600" fill="#2ed88e">passed</text></g>
  </g>
  <g>
    <rect class="box" x="416" y="76" width="164" height="140" rx="14"/>
    <text x="432" y="106" class="mono" font-size="13" font-weight="700" fill="#2ed88e">getPrincipal()</text>
    <text x="432" y="134" class="sans" font-size="13" fill="#b7c9d1">Session reloaded</text>
    <text x="432" y="153" class="sans" font-size="13" fill="#b7c9d1">from the database:</text>
    <text x="432" y="172" class="sans" font-size="13" fill="#b7c9d1">Kestrel, member</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.29;0.31;0.95;1" dur="8s" repeatCount="indefinite"/>
      <circle cx="560" cy="100" r="11" fill="#2ed88e"/><path d="M555 100l3.5 3.5 6.5-7" stroke="#16303d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="432" y="200" class="sans" font-size="12" font-weight="600" fill="#2ed88e">signed in</text></g>
  </g>
  <g>
    <rect class="box" x="596" y="76" width="164" height="140" rx="14"/>
    <text x="612" y="106" class="mono" font-size="13" font-weight="700" fill="#2ed88e">authorize()</text>
    <text x="612" y="134" class="sans" font-size="13" fill="#b7c9d1">Deny by default:</text>
    <text x="612" y="153" class="sans" font-size="13" fill="#b7c9d1">does the role hold</text>
    <text x="612" y="172" class="mono" font-size="12" fill="#b7c9d1">observations.write</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.43;0.95;1" dur="8s" repeatCount="indefinite"/>
      <circle cx="740" cy="100" r="11" fill="#2ed88e"/><path d="M735 100l3.5 3.5 6.5-7" stroke="#16303d" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="612" y="200" class="sans" font-size="12" font-weight="600" fill="#2ed88e">granted</text></g>
  </g>
  <g>
    <rect class="box" x="776" y="76" width="164" height="140" rx="14"/>
    <text x="792" y="106" class="mono" font-size="13" font-weight="700" fill="#2ed88e">sameTenant()</text>
    <text x="792" y="134" class="sans" font-size="13" fill="#b7c9d1">Is #42 owned by</text>
    <text x="792" y="153" class="sans" font-size="13" fill="#b7c9d1">the active bank?</text>
    <text x="792" y="172" class="sans" font-size="13" fill="#b7c9d1">Kestrel ≠ Meridian</text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.53;0.55;0.95;1" dur="8s" repeatCount="indefinite"/>
      <rect x="776" y="76" width="164" height="140" rx="14" fill="none" stroke="#ff8a7a" stroke-width="2"/>
      <circle cx="920" cy="100" r="11" fill="#ff8a7a"/><path d="M915.5 95.5l9 9M924.5 95.5l-9 9" stroke="#16303d" stroke-width="2.4" stroke-linecap="round"/>
      <text x="792" y="200" class="sans" font-size="12" font-weight="600" fill="#ffb4a8">refused</text></g>
  </g>

  <!-- the answer -->
  <rect x="956" y="76" width="214" height="140" rx="14" fill="#ffffff"/>
  <rect x="956" y="76" width="214" height="140" rx="14" fill="#fdecea" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0.6;1;0" keyTimes="0;0.65;0.68;0.8;0.92;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="974" y="104" class="sans" font-size="12" font-weight="700" fill="#556670" letter-spacing="1">RESPONSE</text>
  <text x="974" y="140" class="mono" font-size="22" font-weight="700" fill="#b42318">404</text>
  <text x="1028" y="140" class="sans" font-size="16" font-weight="600" fill="#16303d">Not found</text>
  <text x="974" y="168" class="sans" font-size="13" fill="#556670">Not "forbidden": another</text>
  <text x="974" y="186" class="sans" font-size="13" fill="#556670">bank's id looks like one</text>
  <text x="974" y="204" class="sans" font-size="13" fill="#556670">that doesn't exist.</text>

  <circle r="9" fill="url(#pulse)">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0;0.206;0.206;0.398;0.398;0.590;0.590;0.781;0.781;1;1"
      keyTimes="0;0.05;0.17;0.21;0.29;0.33;0.41;0.45;0.53;0.57;0.65;1">
      <mpath href="#track"/>
    </animateMotion>
  </circle>

  <text x="600" y="282" class="sans" font-size="13" fill="#9fb6bf" text-anchor="middle">The same chain runs for every page and every API call. The security suite calls the API directly, with no UI, to prove it.</text>
</svg>
